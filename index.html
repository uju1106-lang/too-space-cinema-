<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Too Space Cinema</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #08090d;
    color: #f5f5f5;
    font-family: Arial, "Noto Sans KR", sans-serif;
  }

  .movie-card {
    background: #12141b;
    border: 1px solid #252936;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.25s;
    cursor: pointer;
  }

  .movie-card:hover {
    transform: translateY(-6px);
    border-color: #777;
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
  }

  .poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #1b1d25;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal {
    width: min(900px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #11131a;
    border: 1px solid #30333e;
    border-radius: 20px;
    padding: 25px;
  }

  .rating-box {
    background: #191c25;
    border: 1px solid #2b2e39;
    border-radius: 14px;
    padding: 16px;
  }

  .search-box {
    background: #141720;
    border: 1px solid #30333e;
  }

  select, input {
    outline: none;
  }

  .logo {
    letter-spacing: -1px;
  }
</style>
</head>

<body>

<!-- HEADER -->
<header class="border-b border-gray-800 sticky top-0 z-50 bg-[#08090d]/95 backdrop-blur">
  <div class="max-w-7xl mx-auto px-5 py-5 flex flex-col md:flex-row gap-4 justify-between items-center">

    <button onclick="resetAll()" class="logo text-2xl md:text-3xl font-black">
      Too Space <span class="text-gray-400">Cinema</span>
    </button>

    <div class="flex gap-2 w-full md:w-auto">

      <input
        id="searchInput"
        type="text"
        placeholder="영화 제목, 감독, 배우 검색..."
        class="search-box rounded-xl px-4 py-3 w-full md:w-80 text-white"
        oninput="renderMovies()"
      >

      <button
        onclick="resetAll()"
        class="px-4 py-3 rounded-xl bg-white text-black font-bold hover:bg-gray-200">
        초기화
      </button>

    </div>

  </div>
</header>


<!-- MAIN -->
<main class="max-w-7xl mx-auto px-5 py-8">

  <!-- INTRO -->
  <section class="mb-8">

    <p class="text-gray-500 text-sm mb-2">
      MOVIE DATABASE
    </p>

    <h1 class="text-4xl md:text-6xl font-black mb-4">
      Too Space Cinema
    </h1>

    <p class="text-gray-400 max-w-2xl">
      다양한 시대의 영화를 한곳에서 검색하고,
      여러 영화 사이트의 평점을 비교해 볼 수 있는 영화 아카이브입니다.
    </p>

  </section>


  <!-- FILTER -->
  <section class="flex flex-col md:flex-row gap-3 mb-8">

    <select
      id="genreFilter"
      onchange="renderMovies()"
      class="bg-[#141720] border border-gray-700 rounded-xl px-4 py-3">
    </select>

    <select
      id="sortSelect"
      onchange="renderMovies()"
      class="bg-[#141720] border border-gray-700 rounded-xl px-4 py-3">

      <option value="new">최신순</option>
      <option value="old">오래된순</option>
      <option value="rating">평점순</option>
      <option value="name">가나다순</option>

    </select>

    <div
      id="countText"
      class="flex items-center px-4 text-gray-400">
    </div>

  </section>


  <!-- MOVIES -->
  <section
    id="movieGrid"
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
  </section>

</main>


<!-- MODAL -->
<div id="modalBg" class="modal-bg" onclick="closeModal(event)">

  <div class="modal">

    <div class="flex justify-between items-start mb-6">

      <div>
        <p id="modalYear" class="text-gray-500"></p>
        <h2 id="modalTitle" class="text-3xl font-black"></h2>
        <p id="modalOriginal" class="text-gray-500 mt-1"></p>
      </div>

      <button
        onclick="closeModal()"
        class="text-gray-400 text-2xl hover:text-white">
        ✕
      </button>

    </div>


    <div class="grid md:grid-cols-[260px_1fr] gap-7">

      <img
        id="modalPoster"
        class="poster rounded-xl"
        src=""
        alt=""
      >

      <div>

        <div class="mb-6">

          <p class="text-gray-500 text-sm mb-1">
            감독
          </p>

          <p id="modalDirector" class="font-bold text-lg"></p>

        </div>


        <div class="mb-6">

          <p class="text-gray-500 text-sm mb-1">
            장르
          </p>

          <p id="modalGenre" class="font-bold"></p>

        </div>


        <h3 class="text-xl font-bold mb-4">
          사이트별 평점
        </h3>

        <div
          id="ratingGrid"
          class="grid grid-cols-2 gap-3">
        </div>

      </div>

    </div>

  </div>

</div>

  ["포레스트 검프","Forrest Gump",1994,"드라마","로버트 저메키스",8.8,71,82,4.2,8.5],
  ["라이언 일병 구하기","Saving Private Ryan",1998,"전쟁","스티븐 스필버그",8.6,94,91,4.2,8.4],
  ["아메리칸 뷰티","American Beauty",1999,"드라마","샘 멘데스",8.3,87,84,4.0,8.0],
  ["캐롤","Carol",2015,"로맨스","토드 헤인즈",7.2,94,95,4.0,7.7],
  ["파프리카","Paprika",2006,"애니메이션","곤 사토시",7.7,84,81,4.1,7.9],
  ["코코","Coco",2017,"애니메이션","리 언크리치",8.4,97,81,4.2,8.4],
  ["소울","Soul",2020,"애니메이션","피트 닥터",8.0,95,83,4.0,8.1],
  ["엘리멘탈","Elemental",2023,"애니메이션","피터 손",7.0,74,58,3.6,7.4],

  ["시민 케인","Citizen Kane",1941,"드라마","오슨 웰스",8.3,99,100,4.1,7.9]

];


/* =========================================================
   MOVIE OBJECT
========================================================= */

const movieList = movies.map((m, i) => ({
  id: i + 1,
  title: m[0],
  original: m[1],
  year: m[2],
  genre: m[3],
  director: m[4],
  imdb: m[5],
  rt: m[6],
  metacritic: m[7],
  letterboxd: m[8],
  tmdb: m[9]
}));


/* =========================================================
   POSTER
========================================================= */

function posterUrl(title) {

  return "https://placehold.co/500x750/151820/FFFFFF?text="
    + encodeURIComponent(title);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   AVERAGE
========================================================= */

function averageRating(movie) {

  const values = [
    movie.imdb,
    movie.rt / 10,
    movie.metacritic / 10,
    movie.letterboxd * 2,
    movie.tmdb
  ].filter(x => typeof x === "number");

  if (!values.length) return 0;

  return values.reduce((a,b) => a+b, 0) / values.length;

}


/* =========================================================
   GENRE
========================================================= */

function loadGenres() {

  const genres = [...new Set(movieList.map(m => m.genre))]
    .sort();

  const select = document.getElementById("genreFilter");

  select.innerHTML =
    `<option value="all">전체 장르</option>` +
    genres.map(g =>
      `<option value="${escapeHTML(g)}">${escapeHTML(g)}</option>`
    ).join("");

}


/* =========================================================
   RENDER
========================================================= */

function renderMovies() {

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const genre =
    document.getElementById("genreFilter").value;

  const sort =
    document.getElementById("sortSelect").value;


  let filtered = movieList.filter(movie => {

    const text = (
      movie.title + " " +
      movie.original + " " +
      movie.director + " " +
      movie.genre + " " +
      movie.year
    ).toLowerCase();

    const searchOK = text.includes(search);

    const genreOK =
      genre === "all" ||
      movie.genre === genre;

    return searchOK && genreOK;

  });


  if (sort === "new") {

    filtered.sort((a,b) => b.year - a.year);

  }

  else if (sort === "old") {

    filtered.sort((a,b) => a.year - b.year);

  }

  else if (sort === "rating") {

    filtered.sort(
      (a,b) => averageRating(b) - averageRating(a)
    );

  }

  else if (sort === "name") {

    filtered.sort(
      (a,b) => a.title.localeCompare(b.title, "ko")
    );

  }


  document.getElementById("countText").textContent =
    `${filtered.length}편`;

  const grid =
    document.getElementById("movieGrid");


  if (!filtered.length) {

    grid.innerHTML = `
      <div class="col-span-full text-center py-20 text-gray-500">
        검색 결과가 없습니다.
      </div>
    `;

    return;

  }


  grid.innerHTML = filtered.map(movie => {

    return `
      <article
        class="movie-card"
        onclick="openMovie(${movie.id})">

        <img
          class="poster"
          src="${posterUrl(movie.title)}"
          alt="${escapeHTML(movie.title)}"
          loading="lazy"
        >

        <div class="p-4">

          <div class="text-xs text-gray-500 mb-1">
            ${movie.year} · ${escapeHTML(movie.genre)}
          </div>

          <h2 class="font-bold truncate">
            ${escapeHTML(movie.title)}
          </h2>

          <p class="text-sm text-gray-500 truncate mt-1">
            ${escapeHTML(movie.director)}
          </p>

          <div class="mt-3 flex justify-between items-center">

            <span class="text-xs text-gray-500">
              평균
            </span>

            <span class="font-bold">
              ${averageRating(movie).toFixed(1)}
            </span>

          </div>

        </div>

      </article>
    `;

  }).join("");

}


/* =========================================================
   OPEN MOVIE
========================================================= */

function openMovie(id) {

  const movie =
    movieList.find(m => m.id === id);

  if (!movie) return;


  document.getElementById("modalTitle").textContent =
    movie.title;

  document.getElementById("modalOriginal").textContent =
    movie.original;

  document.getElementById("modalYear").textContent =
    movie.year;

  document.getElementById("modalDirector").textContent =
    movie.director;

  document.getElementById("modalGenre").textContent =
    movie.genre;

  document.getElementById("modalPoster").src =
    posterUrl(movie.title);

  document.getElementById("modalPoster").alt =
    movie.title;


  document.getElementById("ratingGrid").innerHTML = `

    <div class="rating-box">
      <p class="text-gray-500 text-sm">IMDb</p>
      <p class="text-2xl font-black mt-1">
        ${movie.imdb}/10
      </p>
    </div>

    <div class="rating-box">
      <p class="text-gray-500 text-sm">Rotten Tomatoes</p>
      <p class="text-2xl font-black mt-1">
        ${movie.rt}%
      </p>
    </div>

    <div class="rating-box">
      <p class="text-gray-500 text-sm">Metacritic</p>
      <p class="text-2xl font-black mt-1">
        ${movie.metacritic}/100
      </p>
    </div>

    <div class="rating-box">
      <p class="text-gray-500 text-sm">Letterboxd</p>
      <p class="text-2xl font-black mt-1">
        ${movie.letterboxd}/5
      </p>
    </div>

    <div class="rating-box">
      <p class="text-gray-500 text-sm">TMDB</p>
      <p class="text-2xl font-black mt-1">
        ${movie.tmdb}/10
      </p>
    </div>

    <div class="rating-box">
      <p class="text-gray-500 text-sm">
        Too Space 평균
      </p>

      <p class="text-2xl font-black mt-1">
        ${averageRating(movie).toFixed(1)}/10
      </p>
    </div>

  `;


  document.getElementById("modalBg").style.display =
    "flex";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(event) {

  if (
    !event ||
    event.target.id === "modalBg"
  ) {

    document.getElementById("modalBg")
      .style.display = "none";

  }

}


/* =========================================================
   RESET
========================================================= */

function resetAll() {

  document.getElementById("searchInput").value = "";

  document.getElementById("genreFilter").value = "all";

  document.getElementById("sortSelect").value = "new";

  renderMovies();

}


/* =========================================================
   START
========================================================= */

loadGenres();

renderMovies();

</script>

</html>
