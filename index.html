<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Space Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Too Space Cinema</h1>
    </header>

    <div class="controls">
        <div id="genreButtons" class="genre-buttons"></div>
        <div class="search-sort-group">
            <input type="text" id="searchInput" placeholder="영화, 감독, 배우 검색...">
            <select id="sortSelect">
                <option value="title-asc">제목순</option>
                <option value="title-desc">제목 역순</option>
                <option value="year-desc">최신순</option>
                <option value="year-asc">오래된순</option>
                <option value="rating-desc">평점 높은순</option>
                <option value="rating-asc">평점 낮은순</option>
            </select>
        </div>
    </div>

    <div id="movieGrid" class="movie-grid"></div>

    <!-- 영화 상세 모달 -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <button id="modalCloseBtn" class="modal-close">&times;</button>
            <img id="modalPoster" class="modal-poster" src="" alt="포스터">
            <div class="modal-details">
                <div>
                    <h2 id="modalTitle"></h2>
                    <p id="modalTitleEn" style="color: var(--text-sub);"></p>
                </div>
                <p><strong>개봉연도:</strong> <span id="modalYear"></span></p>
                <p><strong>감독:</strong> <span id="modalDirector"></span></p>
                <p><strong>출연:</strong> <span id="modalCast"></span></p>
                <p><strong>평균 평점:</strong> ★ <span id="modalAvgRating"></span> / 10</p>
                <div>
                    <strong>사이트별 평점:</strong>
                    <div id="modalRatingsList" class="ratings-grid"></div>
                </div>
                <p id="modalPlot" style="line-height: 1.5; color: #cbd5e1;"></p>
            </div>
        </div>
    </div>

    <!-- 데이터 및 스크립트 연결 -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
